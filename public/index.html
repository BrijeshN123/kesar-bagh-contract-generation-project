<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kesar Bagh Contract Studio</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Kesar Bagh Palace</h1><span>Contract Studio</span></header><main><section><h2>Drafts & agreements</h2><div id="status" role="status">Loading bookings…</div><form id="booking-form"><label>Client / company name<input name="clientName" required></label><label>Contact number<input name="contactNumber"></label><label>Email address<input name="emailAddress" type="email"></label><label>Event name<input name="eventName" required></label><label>Event type<input name="eventType"></label><label>Event date<input name="eventDate" type="date" required></label><label>End date<input name="eventEndDate" type="date"></label><label>Guest count<input name="guestCount" type="number" min="0" value="0"></label><label>Venue rental (INR)<input name="venueRental" type="number" min="0" value="0"></label><label>Accommodation / rooms (INR)<input name="roomRate" type="number" min="0" value="0"></label><label>Food & beverage (INR)<input name="foodAndBeverage" type="number" min="0" value="0"></label><label>Decor (INR)<input name="decor" type="number" min="0" value="0"></label><label>Entertainment (INR)<input name="entertainment" type="number" min="0" value="0"></label><label>Service charge (INR)<input name="serviceCharge" type="number" min="0" value="0"></label><label>Taxes (INR)<input name="taxes" type="number" min="0" value="0"></label><label>Deposit percent<input name="depositPercent" type="number" min="0" max="100" value="50"></label><label>Final payment due<input name="finalPaymentDue" type="date"></label><label>Special conditions<textarea name="specialConditions" rows="5"></textarea></label><div class="actions"><button type="button" id="save">Save draft</button><button type="button" id="generate">Generate PDF</button></div></form></section><aside><h2>Saved drafts</h2><ul id="bookings"></ul></aside></main><script src="/app.js" defer></script></body></html>
