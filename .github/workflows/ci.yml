name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm test
